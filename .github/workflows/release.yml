name: Release APK
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_SIGNING_CONFIGURED: ${{ secrets.BATOMON_RELEASE_KEYSTORE_BASE64 != '' && secrets.BATOMON_RELEASE_STORE_PASSWORD != '' && secrets.BATOMON_RELEASE_KEY_ALIAS != '' && secrets.BATOMON_RELEASE_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare stable signing key (when configured)
        if: env.RELEASE_SIGNING_CONFIGURED == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.BATOMON_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/batomon-release.keystore"
      - name: Build and test
        env:
          BATOMON_RELEASE_KEYSTORE: ${{ runner.temp }}/batomon-release.keystore
          BATOMON_RELEASE_STORE_PASSWORD: ${{ secrets.BATOMON_RELEASE_STORE_PASSWORD }}
          BATOMON_RELEASE_KEY_ALIAS: ${{ secrets.BATOMON_RELEASE_KEY_ALIAS }}
          BATOMON_RELEASE_KEY_PASSWORD: ${{ secrets.BATOMON_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest
          if [ -f "$BATOMON_RELEASE_KEYSTORE" ]; then ./gradlew assembleRelease; else echo "Stable signing secrets are not configured; producing debug-signed diagnostic APK"; ./gradlew assembleDebug; fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/batomon-companion-android-${GITHUB_REF_NAME}.apk; else cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/batomon-companion-android-${GITHUB_REF_NAME}.apk; fi
      - name: Checksums
        run: sha256sum app/build/outputs/apk/*/batomon-companion-android-${GITHUB_REF_NAME}.apk > app/build/outputs/apk/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/*/batomon-companion-android-${{ github.ref_name }}.apk
            app/build/outputs/apk/SHA256SUMS
