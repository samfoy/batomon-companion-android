name: Release APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and sign the release artifact without publishing a GitHub release
        required: true
        default: true
        type: boolean
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_SIGNING_CONFIGURED: ${{ secrets.BATOMON_RELEASE_KEYSTORE_BASE64 != '' && secrets.BATOMON_RELEASE_STORE_PASSWORD != '' && secrets.BATOMON_RELEASE_KEY_ALIAS != '' && secrets.BATOMON_RELEASE_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Android build packages
        run: |
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"; fi
          export PATH="$(dirname "$sdkmanager"):$sdk_root/platform-tools:$PATH"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Resolve artifact mode
        id: metadata
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "stem=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "stem=dry-run-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare stable signing key (when configured)
        if: env.RELEASE_SIGNING_CONFIGURED == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.BATOMON_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/batomon-release.keystore"
      - name: Require stable signing for release artifacts
        if: env.RELEASE_SIGNING_CONFIGURED != 'true'
        run: |
          echo 'Stable release secrets are required for this workflow.' >&2
          exit 1
      - name: Build and test
        id: build
        env:
          BATOMON_RELEASE_KEYSTORE: ${{ runner.temp }}/batomon-release.keystore
          BATOMON_RELEASE_STORE_PASSWORD: ${{ secrets.BATOMON_RELEASE_STORE_PASSWORD }}
          BATOMON_RELEASE_KEY_ALIAS: ${{ secrets.BATOMON_RELEASE_KEY_ALIAS }}
          BATOMON_RELEASE_KEY_PASSWORD: ${{ secrets.BATOMON_RELEASE_KEY_PASSWORD }}
          APK_STEM: ${{ steps.metadata.outputs.stem }}
        run: |
          ./gradlew testDebugUnitTest
          ./gradlew assembleRelease
          apk_name="batomon-companion-android-${APK_STEM}.apk"
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/$apk_name"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"
      - name: Checksums
        env:
          APK_NAME: ${{ steps.build.outputs.apk_name }}
        run: sha256sum "app/build/outputs/apk/release/$APK_NAME" > app/build/outputs/apk/release/SHA256SUMS
      - name: Upload signed dry-run artifact
        if: steps.metadata.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: batomon-release-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/${{ steps.build.outputs.apk_name }}
            app/build/outputs/apk/release/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        if: steps.metadata.outputs.publish == 'true'
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/${{ steps.build.outputs.apk_name }}
            app/build/outputs/apk/release/SHA256SUMS
