name: Android
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Android build packages
        run: |
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"; fi
          export PATH="$(dirname "$sdkmanager"):$sdk_root/platform-tools:$PATH"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: batomon-companion-debug, path: app/build/outputs/apk/debug/*.apk }

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-linux-hw-accel: false
          emulator-boot-timeout: 180
          disable-animations: true
          script: |
            set -euo pipefail
            ./gradlew :app:assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell settings delete global overlay_display_devices || true
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.samfoy.batomon.MainActivityPrimaryTest
            adb shell settings put global overlay_display_devices '1240x1080/160'
            adb shell am force-stop com.samfoy.batomon
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.samfoy.batomon.MainActivitySecondaryDisplayTest
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.samfoy.batomon.data.RunPersistenceTest
      - name: Collect emulator evidence
        if: always()
        run: |
          mkdir -p artifacts
          collect() {
            name="$1"
            shift
            if timeout --foreground 20s "$@" > "artifacts/$name" 2>&1; then
              :
            else
              echo "command timed out or failed: $*" >> "artifacts/$name"
            fi
          }
          collect adb-devices.txt adb devices -l
          collect getprop.txt adb shell getprop
          collect dumpsys-display.txt adb shell dumpsys display
          collect dumpsys-activity.txt adb shell dumpsys activity activities
          collect logcat.txt adb logcat -d -v threadtime
          collect screenshot.png adb exec-out screencap -p
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batomon-emulator-evidence
          path: artifacts/
          if-no-files-found: warn
